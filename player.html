<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Read aloud</title>
<style>
  body { margin: 0; padding: 4px 8px; background: white; }
  audio { display: block; width: 100%; height: 48px; }
</style>

<audio controls preload="metadata" aria-label="Read aloud"></audio>

<script>
  const page = new URLSearchParams(location.search).get("page") ?? "01";
  if (/^(0[1-9]|10)$/.test(page)) {
    document.querySelector("audio").src = `Tom_page${page}.mp3`;
  }
</script>
</html>
